services:
  postgres:
    image: postgres:16
    container_name: book-tracker-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-booktracker}
    ports:
      - "5432:5432"
    volumes:
      - book-tracker-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U booktracker -d booktracker"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  book-tracker-data:
